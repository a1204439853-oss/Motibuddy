[package]
name = "motibuddy"
version = "0.1.0"
description = "MotiBuddy - 你的桌面任务管理伙伴"
authors = ["MotiBuddy Team"]
edition = "2021"

[[bin]]
name = "motibuddy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
winres = "0.1"

[dependencies]
tauri = { version = "1.5", features = [ "dialog-all", "path-all", "fs-all", "notification-all", "window-all", "shell-open", "system-tray", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
base64 = "0.21"
url = "2.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Windows 特定配置
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
winreg = "0.52.0"
windows = { version = "0.39", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 优化大小
opt-level = "s"
lto = true
# 兼容性设置
panic = "abort"
